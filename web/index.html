    #natter-boot.is-ready { opacity: 0; visibility: hidden; pointer-events: none; }
    .natter-boot__content { position: relative; z-index: 1; width: 100%; max-width: 320px; }
    .natter-boot__logo {
      display: block;
      width: 76px;
      height: 76px;
      object-fit: contain;
      margin: 0 auto 14px;
      filter: drop-shadow(0 0 12px rgba(61,166,243,.10));
    }
    /* Single filled glyph: faint aurora tones reveal the sky underneath.
       Avoid a glyph stroke, which exposes internal joins in rounded letters. */
    .natter-boot__brand {
      display: inline-block;
      margin: 0;
      font-family: "Natter Nunito", sans-serif;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.45px;
      line-height: 1.2;
      background: linear-gradient(
        115deg,
        rgba(61,166,243,.26) 0%,
        rgba(156,107,255,.17) 40%,
        rgba(255,93,162,.22) 73%,
        rgba(61,166,243,.17) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      text-shadow: none;
    }
    .natter-boot__strapline { margin: 10px 0 34px; font-size: 14px; letter-spacing: .4px; }
    .natter-boot__connect { color: #3da6f3; }
    .natter-boot__protect { color: #ff5da2; }
    .natter-boot__grow { color: #a4d35a; }
    .natter-boot__separator { color: rgba(240,246,255,.37); padding: 0 .3em; }
    .natter-boot__activity { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 13px; color: #cbd5e2; }
    .natter-boot__dots { display: flex; gap: 5px; }
    .natter-boot__dot { width: 6px; height: 6px; border-radius: 50%; animation: natter-breathe 1.65s ease-in-out infinite; }
    .natter-boot__dot:nth-child(1) { background: #3da6f3; }
    .natter-boot__dot:nth-child(2) { background: #ff5da2; animation-delay: .22s; }
    .natter-boot__dot:nth-child(3) { background: #a4d35a; animation-delay: .44s; }
    .natter-boot__slow { margin: 28px auto 0; color: #cbd5e2; font-size: 12px; line-height: 1.6; }
    .natter-boot__retry {
      display: inline-flex; align-items: center; justify-content: center;
      margin-top: 12px; padding: 9px 17px; min-height: 34px;
      color: #e6f3ff; background: transparent; border: 1px solid rgba(61,166,243,.45);
      border-radius: 999px; font: inherit; cursor: pointer;
      -webkit-tap-highlight-color: transparent; outline: none;
    }
    .natter-boot__retry:focus-visible {
      outline: 2px solid rgba(61,166,243,.70);
      outline-offset: 3px;
    }
    .natter-boot__retry:active { background: rgba(61,166,243,.12); }
    /* Temporary Codespaces-only diagnostics, never shown in the public site. */
    #natter-diagnostics[hidden], #natter-diagnostics-panel[hidden] { display: none !important; }
    #natter-diagnostics {
      position: fixed; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      z-index: 2147483000; font-family: system-ui, sans-serif;
    }
    #natter-diagnostics-toggle {
      display: block; margin-left: auto; padding: 9px 13px;
      border: 1px solid rgba(120,185,255,.6); border-radius: 999px;
      color: #fff; background: rgba(7,22,47,.92); font-size: 12px;
      font-weight: 650; -webkit-tap-highlight-color: transparent;
    }
    #natter-diagnostics-panel {
      width: min(88vw, 390px); max-height: 54dvh; overflow: auto;
      box-sizing: border-box; margin-bottom: 8px; padding: 14px;
      border: 1px solid rgba(120,185,255,.35); border-radius: 16px;
      background: rgba(5,17,39,.98); box-shadow: 0 8px 36px rgba(0,0,0,.36);
      color: #e4f2ff; font-size: 12px; line-height: 1.4;
    }
    #natter-diagnostics-panel h2 { margin: 0 0 8px; font-size: 14px; }
    #natter-diagnostics-log {
      white-space: pre-wrap; overflow-wrap: anywhere; margin: 0;
      font: 11px/1.55 ui-monospace, SFMono-Regular, monospace;
    }
    #natter-diagnostics-panel p { margin: 0 0 10px; color: #adc1d5; }
    #natter-diagnostics-copy {
      border-radius: 999px; border: 1px solid #315b87;
      color: #fff; background: #122c4d; padding: 7px 13px;
      margin-top: 10px; -webkit-tap-highlight-color: transparent;
    }
    @keyframes natter-breathe { 0%, 70%, 100% { opacity: .4; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) {
      #natter-boot { transition: none; }
      .natter-boot__dot { animation: none; opacity: .85; }
    }

</head>
<body>
  <div id="natter-boot" aria-label="Natter is opening">
    <div class="natter-boot__content">
      <img class="natter-boot__logo" src="natter-logo.png" alt="" width="76" height="76" decoding="async">
      <h1 class="natter-boot__brand">Natter</h1>
      <p class="natter-boot__strapline"><span class="natter-boot__connect">Connect</span><span class="natter-boot__separator">·</span><span class="natter-boot__protect">Protect</span><span class="natter-boot__separator">·</span><span class="natter-boot__grow">Grow</span></p>
      <div class="natter-boot__activity" role="status" aria-live="polite">
        <span class="natter-boot__dots" aria-hidden="true">
          <span class="natter-boot__dot"></span>
          <span class="natter-boot__dot"></span>
          <span class="natter-boot__dot"></span>
        </span>
        <span>Opening your space…</span>
      </div>
      <div id="natter-boot-slow" class="natter-boot__slow" hidden>
        This is taking a little longer than usual.
        <div><button class="natter-boot__retry" type="button" onclick="window.location.reload()">Try again</button></div>
      </div>
    </div>
  </div>
  <!-- Dev preview only: shown on localhost/Codespaces. No child data collected. -->
  <div id="natter-diagnostics" hidden>
    <section id="natter-diagnostics-panel" hidden aria-label="Startup diagnostic timings">
      <h2>Natter startup timings</h2>
      <p>Relative timings only. No messages, child IDs or tokens.</p>
      <pre id="natter-diagnostics-log"></pre>
      <button id="natter-diagnostics-copy" type="button">Copy timings</button>
    </section>
    <button id="natter-diagnostics-toggle" type="button" aria-expanded="false">Timings</button>
  </div>
  <script>
    (function () {
      const boot = document.getElementById('natter-boot');
      const slow = document.getElementById('natter-boot-slow');
      // Development-only diagnostics. Does not affect Firebase or navigation.
      const measureStartup = location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1' ||
        location.hostname.endsWith('.app.github.dev');
      const startupStartedAt = performance.now();
      const diagnostics = document.getElementById('natter-diagnostics');
      const panel = document.getElementById('natter-diagnostics-panel');
      const toggle = document.getElementById('natter-diagnostics-toggle');
      const report = document.getElementById('natter-diagnostics-log');
      const copy = document.getElementById('natter-diagnostics-copy');
      const storageKey = 'natter-debug-startup-timings-v1';
      let previous = [];
      const events = [];
      const allowedMilestones = new Set([
        'Dart main started', 'Flutter binding ready',
        'Firebase Core initialised', 'App Check activated',
        'App Check token refresh configured', 'runApp invoked',
        'Flutter first router frame displayed',
        'Looking up saved device mode', 'Device mode lookup complete',
        'Hydrating remembered child session',
        'Remembered child session hydration complete',
        'Navigating to parent home', 'Navigating to child gateway',
        'Navigating to child chats', 'Navigating to family welcome',
        'Chats screen built', 'Chats auth present', 'Chats auth not present',
        'Outgoing stream subscribed', 'Outgoing stream waiting',
        'Outgoing stream data received', 'Outgoing stream error',
        'Incoming stream subscribed', 'Incoming stream waiting',
        'Incoming stream data received', 'Incoming stream error',
        'Conversation stream subscribed', 'Conversation stream waiting',
        'Conversation stream data empty',
        'Conversation stream data nonempty', 'Conversation stream error'
      ]);
      function renderReport() {
        if (!report) return;
        report.textContent = 'CURRENT LOAD\n' + events.join('\n') +
          (previous.length ? '\n\nPREVIOUS LOAD (same tab)\n' + previous.join('\n') : '');
      }
      function addTiming(label) {
        if (!measureStartup) return;
        const seconds = ((performance.now() - startupStartedAt) / 1000).toFixed(1);
        events.push('+' + seconds + 's  ' + label);
        if (events.length > 35) events.shift();
        renderReport();
        try { sessionStorage.setItem(storageKey, JSON.stringify(events)); } catch (_) {}
      }
      // Only predefined, non-identifying milestones are accepted from Dart.
      window.natterStartupMilestone = function (milestone) {
        if (!measureStartup || typeof milestone !== 'string') return;
        const match = /^(\d+)ms: (.*)$/.exec(milestone);
        if (!match || !allowedMilestones.has(match[2])) return;
        addTiming('Dart: ' + match[2] + ' (Dart +' + match[1] + 'ms)');
      };
      if (measureStartup && diagnostics && panel && toggle && report) {
        try {
          const saved = JSON.parse(sessionStorage.getItem(storageKey) || '[]');
          if (Array.isArray(saved)) previous = saved.filter(
            (entry) => typeof entry === 'string' && entry.length < 180
          ).slice(-35);
        } catch (_) {}
        diagnostics.hidden = false;
        toggle.addEventListener('click', function () {
          panel.hidden = !panel.hidden;
          toggle.setAttribute('aria-expanded', String(!panel.hidden));
        });
        if (copy) copy.addEventListener('click', async function () {
          try {
            await navigator.clipboard.writeText(report.textContent);
            copy.textContent = 'Copied';
          } catch (_) {
            copy.textContent = 'Screenshot instead';
          }
        });
        addTiming('HTML loader ready');
        window.addEventListener('load', function () { addTiming('Window load event'); }, { once: true });
      }
      let finished = false;
      const slowTimer = window.setTimeout(function () {
        if (!finished && slow) {
          slow.hidden = false;
          if (measureStartup) {
            addTiming('Still waiting for Flutter first frame (20s warning)');
            console.info('[Natter boot] waiting for first Flutter frame: ' +
              Math.round(performance.now() - startupStartedAt) + 'ms since loader');
          }
        }
      }, 20000);
      window.addEventListener('flutter-first-frame', function () {
        finished = true;
        if (measureStartup) {
          addTiming('Flutter first-frame browser event');
          console.info('[Natter boot] flutter-first-frame received: ' +
            Math.round(performance.now() - startupStartedAt) + 'ms since loader');
        }
        window.clearTimeout(slowTimer);
        if (!boot) return;
        boot.classList.add('is-ready');
        // Fallback for reduced-motion environments without a CSS transition.
        window.setTimeout(function () { boot.remove(); }, 550);
      }, { once: true });
    }());
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
