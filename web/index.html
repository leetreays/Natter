    html, body { margin: 0; min-height: 100%; background: #06112e; }
    #natter-boot {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      box-sizing: border-box;
      padding: 32px 24px;
      color: #f9fbff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
          /* off-screen moon glow */
      radial-gradient(
        circle at -6% 8%,
        rgba(255, 250, 235, 0.32) 0%,
        rgba(255, 250, 235, 0.15) 11%,
        rgba(220, 230, 255, 0.06) 20%,
        transparent 31%
      ),
      
          /* violet night cloud */
          radial-gradient(
            ellipse at 74% 18%,
            rgba(124, 78, 188, 0.22) 0%,
            rgba(124, 78, 188, 0.08) 30%,
            transparent 60%
          ),
      
          /* pink haze */
          radial-gradient(
            ellipse at 82% 44%,
            rgba(255, 93, 162, 0.13) 0%,
            rgba(255, 93, 162, 0.05) 28%,
            transparent 58%
          ),
      
          /* cool blue haze */
          radial-gradient(
            ellipse at 24% 58%,
            rgba(61, 166, 243, 0.14) 0%,
            rgba(61, 166, 243, 0.05) 30%,
            transparent 60%
          ),
      
          /* first suggestion of dawn below horizon */
          radial-gradient(
            ellipse at 50% 118%,
            rgba(61, 166, 243, 0.18) 0%,
            rgba(61, 166, 243, 0.08) 26%,
            transparent 58%
          ),
      
          linear-gradient(
            180deg,
            #01030a 0%,
            #020717 30%,
            #050d25 63%,
            #081634 100%
          );
      text-align: center;
      opacity: 1;
      transition: opacity 360ms ease, visibility 0s linear 360ms;
    }
    /* Reuse the actual star fields from the Natter holding page. */
    #natter-boot::before, #natter-boot::after { z-index: 0; }
    /* occasional brighter stars */

    radial-gradient(circle at 63% 11%, rgba(255,255,255,.48) 0 1px, transparent 1.6px),
    radial-gradient(circle at 72% 34%, rgba(255,255,255,.28) 0 .8px, transparent 1.4px),
    radial-gradient(circle at 88% 13%, rgba(255,255,255,.58) 0 1px, transparent 1.6px),

    radial-gradient(circle at 22% 17%, rgba(255,255,255,.17) 0 .55px, transparent 1px),
    radial-gradient(circle at 24% 42%, rgba(255,255,255,.09) 0 .45px, transparent .85px),
    radial-gradient(circle at 27% 63%, rgba(255,255,255,.13) 0 .5px, transparent .9px),
    radial-gradient(circle at 30% 73%, rgba(255,255,255,.1) 0 .45px, transparent .85px),
    radial-gradient(circle at 35% 31%, rgba(255,255,255,.18) 0 .55px, transparent 1px),
    radial-gradient(circle at 38% 17%, rgba(255,255,255,.11) 0 .45px, transparent .85px),
    radial-gradient(circle at 41% 57%, rgba(255,255,255,.09) 0 .45px, transparent .85px),
    radial-gradient(circle at 43% 12%, rgba(255,255,255,.13) 0 .5px, transparent .9px),
    radial-gradient(circle at 46% 69%, rgba(255,255,255,.12) 0 .45px, transparent .9px),
    radial-gradient(circle at 49% 35%, rgba(255,255,255,.1) 0 .45px, transparent .85px),

    radial-gradient(circle at 54% 26%, rgba(255,255,255,.09) 0 .45px, transparent .85px),

    radial-gradient(circle at 61% 59%, rgba(255,255,255,.12) 0 .5px, transparent .9px),
    radial-gradient(circle at 65% 43%, rgba(255,255,255,.09) 0 .45px, transparent .85px),
    radial-gradient(circle at 68% 25%, rgba(255,255,255,.13) 0 .5px, transparent .9px),
    radial-gradient(circle at 71% 64%, rgba(255,255,255,.1) 0 .45px, transparent .85px),
    radial-gradient(circle at 76% 9%, rgba(255,255,255,.15) 0 .5px, transparent .9px),
    radial-gradient(circle at 78% 47%, rgba(255,255,255,.1) 0 .45px, transparent .85px),

    radial-gradient(circle at 54% 88%, rgba(255,255,255,.12) 0 .45px, transparent .85px),
    radial-gradient(circle at 73% 92%, rgba(255,255,255,.1) 0 .45px, transparent .85px),

    #natter-boot.is-ready { opacity: 0; visibility: hidden; pointer-events: none; }
    .natter-boot__content { position: relative; z-index: 1; width: 100%; max-width: 700px; }
    .natter-boot__brand {
      margin: 0;
      font-size: clamp(55px, 12vw, 108px);
      font-weight: 650;
      letter-spacing: -.075em;
      line-height: 1.05;
      color: rgba(251, 253, 255, .055);
      -webkit-text-stroke: 1px rgba(231, 244, 255, .30);
      text-shadow: 0 0 20px rgba(255, 255, 255, .075);
    }
    .natter-boot__strapline { margin: 18px 0 38px; color: rgba(240, 246, 255, .67); font-size: 14px; letter-spacing: .4px; }
    @supports not (-webkit-text-stroke: 1px white) {
      .natter-boot__brand { color: rgba(245, 250, 255, .24); }
    }
    .natter-boot__activity { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 13px; color: #cbd5e2; }
    .natter-boot__dots { display: flex; gap: 5px; }
    .natter-boot__dot { width: 6px; height: 6px; border-radius: 50%; animation: natter-breathe 1.65s ease-in-out infinite; }
    .natter-boot__dot:nth-child(1) { background: #3da6f3; }
    .natter-boot__dot:nth-child(2) { background: #ff5da2; animation-delay: .22s; }
    .natter-boot__dot:nth-child(3) { background: #a4d35a; animation-delay: .44s; }
    .natter-boot__slow { margin: 28px auto 0; color: #cbd5e2; font-size: 12px; line-height: 1.6; }
    .natter-boot__retry { display: inline-block; margin-top: 12px; padding: 9px 17px; color: #e6f3ff; background: transparent; border: 1px solid rgba(61,166,243,.45); border-radius: 999px; font: inherit; cursor: pointer; }
    @keyframes natter-breathe { 0%, 70%, 100% { opacity: .4; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) {
      #natter-boot { transition: none; }
      .natter-boot__dot { animation: none; opacity: .85; }
    }
  </style>
</head>
<body>
  <div id="natter-boot" aria-label="Natter is opening">
    <div class="natter-boot__content">
      <h1 class="natter-boot__brand">Natter</h1>
      <p class="natter-boot__strapline">Connect · Protect · Grow</p>
      <div class="natter-boot__activity" role="status" aria-live="polite">
        <span class="natter-boot__dots" aria-hidden="true">
          <span class="natter-boot__dot"></span>
          <span class="natter-boot__dot"></span>
          <span class="natter-boot__dot"></span>
        </span>
        <span>Opening your space…</span>
      </div>
      <div id="natter-boot-slow" class="natter-boot__slow" hidden>
        This is taking a little longer than usual.
        <div><button class="natter-boot__retry" type="button" onclick="window.location.reload()">Try again</button></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const boot = document.getElementById('natter-boot');
      const slow = document.getElementById('natter-boot-slow');
      let finished = false;
      const slowTimer = window.setTimeout(function () {
        if (!finished && slow) slow.hidden = false;
      }, 20000);
      window.addEventListener('flutter-first-frame', function () {
        finished = true;
        window.clearTimeout(slowTimer);
        if (!boot) return;
        boot.classList.add('is-ready');
        // Fallback for reduced-motion environments without a CSS transition.
        window.setTimeout(function () { boot.remove(); }, 550);
      }, { once: true });
    }());
  </script>

  <!--

    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
