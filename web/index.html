<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="natter">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>natter</title>
  <link rel="manifest" href="manifest.json">

  <!-- Branded pre-Flutter loader: paints before the Dart engine starts. -->
  <meta name="theme-color" content="#06112E">
  <style>
    html, body { margin: 0; min-height: 100%; background: #06112e; }
    #natter-boot {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      box-sizing: border-box;
      padding: 32px 24px;
      color: #f9fbff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 80% 18%, rgba(156,107,255,.19), transparent 48%),
        radial-gradient(ellipse at 15% 83%, rgba(61,166,243,.16), transparent 52%),
        linear-gradient(160deg, #07162f, #06112e 55%, #030d22);
      text-align: center;
      opacity: 1;
      transition: opacity 360ms ease, visibility 0s linear 360ms;
    }
    #natter-boot.is-ready { opacity: 0; visibility: hidden; pointer-events: none; }
    .natter-boot__content { width: 100%; max-width: 320px; }
    .natter-boot__symbol {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 86px;
      height: 86px;
      margin-bottom: 22px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 28px;
      background: rgba(255,255,255,.055);
      box-shadow: 0 18px 60px rgba(0,0,0,.14);
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -5px;
    }
    .natter-boot__letter {
      padding-right: 4px;
      background: linear-gradient(140deg, #3da6f3 15%, #9c6bff 48%, #ff5da2 78%, #a4d35a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .natter-boot__brand { margin: 0; font-size: 29px; font-weight: 750; letter-spacing: -.8px; }
    .natter-boot__strapline { margin: 7px 0 36px; color: #c1cada; font-size: 14px; letter-spacing: .35px; }
    .natter-boot__activity { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 13px; color: #cbd5e2; }
    .natter-boot__dots { display: flex; gap: 5px; }
    .natter-boot__dot { width: 6px; height: 6px; border-radius: 50%; animation: natter-breathe 1.65s ease-in-out infinite; }
    .natter-boot__dot:nth-child(1) { background: #3da6f3; }
    .natter-boot__dot:nth-child(2) { background: #ff5da2; animation-delay: .22s; }
    .natter-boot__dot:nth-child(3) { background: #a4d35a; animation-delay: .44s; }
    .natter-boot__slow { margin: 28px auto 0; color: #cbd5e2; font-size: 12px; line-height: 1.6; }
    .natter-boot__retry { display: inline-block; margin-top: 12px; padding: 9px 17px; color: #e6f3ff; background: transparent; border: 1px solid rgba(61,166,243,.45); border-radius: 999px; font: inherit; cursor: pointer; }
    @keyframes natter-breathe { 0%, 70%, 100% { opacity: .4; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) {
      #natter-boot { transition: none; }
      .natter-boot__dot { animation: none; opacity: .85; }
    }
  </style>
</head>
<body>
  <div id="natter-boot" aria-label="Natter is opening">
    <div class="natter-boot__content">
      <div class="natter-boot__symbol" aria-hidden="true"><span class="natter-boot__letter">N</span></div>
      <h1 class="natter-boot__brand">Natter</h1>
      <p class="natter-boot__strapline">Connect · Protect · Grow</p>
      <div class="natter-boot__activity" role="status" aria-live="polite">
        <span class="natter-boot__dots" aria-hidden="true">
          <span class="natter-boot__dot"></span>
          <span class="natter-boot__dot"></span>
          <span class="natter-boot__dot"></span>
        </span>
        <span>Opening your space…</span>
      </div>
      <div id="natter-boot-slow" class="natter-boot__slow" hidden>
        This is taking a little longer than usual.
        <div><button class="natter-boot__retry" type="button" onclick="window.location.reload()">Try again</button></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const boot = document.getElementById('natter-boot');
      const slow = document.getElementById('natter-boot-slow');
      let finished = false;
      const slowTimer = window.setTimeout(function () {
        if (!finished && slow) slow.hidden = false;
      }, 20000);
      window.addEventListener('flutter-first-frame', function () {
        finished = true;
        window.clearTimeout(slowTimer);
        if (!boot) return;
        boot.classList.add('is-ready');
        // Fallback for reduced-motion environments without a CSS transition.
        window.setTimeout(function () { boot.remove(); }, 550);
      }, { once: true });
    }());
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
